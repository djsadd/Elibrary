services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.2
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: elib
      POSTGRES_PASSWORD: elib
      POSTGRES_DB: elib_default
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: clickhouse
    environment:
      - CLICKHOUSE_DB=analytics
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"

  analytics:
    build: ./AnalyticsService
    container_name: analytics
    env_file:
      - AnalyticsService/.env.prod
    depends_on:
      - postgres
      - clickhouse
    ports:
      - "8011:8011"

  gateway:
    build: ./API-Gateaway
    container_name: gateway
    env_file:
      - API-Gateaway/.env.prod
    depends_on:
      - auth
      - catalog
      - filestorage
      - notifications
      - reviews
      - favourites
      - analytics
    ports:
      - "8000:8000"

  auth:
    build: ./AuthService
    container_name: auth
    env_file:
      - AuthService/.env.prod  
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - redis
    ports:
      - "8001:8001"

  catalog:
    build: ./CatalogService
    container_name: catalog
    env_file:
      - CatalogService/.env.prod
    environment:
      - CATALOG_MAX_RAW_MB=200
    volumes:
      - filestorage_data:/app/storage
    depends_on:
      - postgres
    ports:
      - "8002:8002"

  filestorage:
    build: ./FileStorageService
    container_name: filestorage
    env_file:
      - FileStorageService/.env.prod
    volumes:
      - filestorage_data:/app/storage
    ports:
      - "8003:8003"

  notifications:
    build: ./NotificationService
    container_name: notifications
    env_file:
      - NotificationService/.env.prod
    depends_on:
      - postgres
    ports:
      - "8006:8006"

  reviews:
    build: ./reviews
    container_name: reviews
    env_file:
      - reviews/.env.prod
    depends_on:
      - postgres
    ports:
      - "8007:8007"

  favourites:
    build: ./favourites
    container_name: favourites
    env_file:
      - favourites/.env.prod
    depends_on:
      - postgres
    ports:
      - "8008:8008"

  search:
    build: ./SearchService
    container_name: search
    env_file:
      - SearchService/.env.prod
    depends_on:
      - elasticsearch
      - catalog
    ports:
      - "8004:8004"

  otherlibraryintegrations:
    build: ./OtherLibraryIntegrations
    container_name: otherlibraryintegrations
    env_file:
      - OtherLibraryIntegrations/.env.prod
    depends_on:
      - postgres
      - catalog
      - gateway
      - redis
    ports:
      - "8009:8009"

  otherlibraryintegrations_worker:
    build: ./OtherLibraryIntegrations
    container_name: otherlibraryintegrations_worker
    env_file:
      - OtherLibraryIntegrations/.env.prod
    depends_on:
      - redis
      - postgres
      - catalog
    command: celery -A app.tasks worker -l info

  ai:
    build: ./AI
    container_name: ai
    env_file:
      - AI/.env
    ports:
      - "8010:8010"

  platonusauth:
    build: ./PlatonusAuth
    container_name: platonusauth
    environment:
      # можно вынести в отдельный .env позже
      - PLATONUS_USERNAME=${PLATONUS_USERNAME:-}
      - PLATONUS_PASSWORD=${PLATONUS_PASSWORD:-}
    ports:
      - "8013:8013"

  frontend:
    build: ./Frontend/tau-login
    container_name: frontend
    environment:
      - API_SERVER=http://gateway:8000
    ports:
      - "80:80"
    depends_on:
      - gateway

volumes:
  pgdata: {}
  filestorage_data: {}
  clickhouse_data: {}
  esdata: {}
